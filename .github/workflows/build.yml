name: Build Alioth Stable MIUI with Latest SukiSU-Ultra

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
            git gnupg gperf imagemagick libncurses-dev \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 binutils-aarch64-linux-gnu

      - name: Clone Working Kernel Source (cbbad411 only)
        run: |
          git clone --depth=1 --branch v20260505-cbbad411 https://github.com/AstideLabs/android_kernel_xiaomi_sm8250.git .

      - name: Replace Old Driver with Latest SukiSU-Ultra
        run: |
          # Purana driver folder saaf karein
          rm -rf drivers/kernelsu KernelSU
          
          # Official latest SukiSU-Ultra driver integrate karein
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          echo "Latest SukiSU-Ultra Driver Integrated Successfully"

      - name: Setup ZyC-Clang 16 Toolchain
        run: |
          mkdir -p $HOME/zyc-clang
          cd $HOME/zyc-clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
          tar -zxf Clang-16.0.6-20260807.tar.gz
          echo "$HOME/zyc-clang/bin" >> $GITHUB_PATH

      - name: Setup AnyKernel3 (No DTB / No DTBO Touching)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/device.name1=.*/device.name1=alioth/' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=aliothin/' AnyKernel3/anykernel.sh

      - name: Compile Kernel Image Only
        run: |
          export PATH="$HOME/zyc-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          # Base stable config
          make O=out vendor/kona-perf_defconfig CC=clang LLVM=1 LLVM_IAS=1

          # Compile sirf Image (DTB/DTBO ko chhede bina)
          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-w" \
            Image

      - name: Package with AnyKernel3
        run: |
          # Sirf compiled Image dalna hai
          cp out/arch/arm64/boot/Image AnyKernel3/

          cd AnyKernel3
          zip -r9 ../APTKernel_alioth_Latest_SukiSU-Ultra.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APTKernel_alioth_Latest_SukiSU-Ultra
          path: "*.zip"
