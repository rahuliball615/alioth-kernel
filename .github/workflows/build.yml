name: Build Alioth SukiSU 40900

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Download Stable Working Kernel Source
        run: |
          wget https://github.com/AstideLabs/android_kernel_xiaomi_sm8250/archive/refs/tags/v20260505-cbbad411.tar.gz
          tar -xvf v20260505-cbbad411.tar.gz
          mv android_kernel_xiaomi_sm8250-20260505-cbbad411/* .

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex libxml2 libxml2-utils \
            lzop rsync schedtool zip zlib1g-dev libssl-dev libelf-dev binutils-aarch64-linux-gnu

      - name: Update Driver Version to 40900
        run: |
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "Makefile" \) -exec sed -i 's/34891/40900/g' {} +
          echo "Driver Version successfully updated to 40900"

      - name: Download AOSP Clang Toolchain
        run: |
          mkdir clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b.tar.gz
          tar -C clang/ -xf clang-r416183b.tar.gz

      - name: Download AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/device.name1=.*/device.name1=alioth/' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=aliothin/' AnyKernel3/anykernel.sh

      - name: Compile Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out vendor/alioth_defconfig \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1

          make -j$(nproc --all) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Package with AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/vendor/qcom/*.dtb AnyKernel3/dtb 2>/dev/null || true

          cd AnyKernel3
          zip -r9 ../Alioth_MIUI14_SukiSU_40900.zip * -x .git README.md *placeholder

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Alioth_MIUI14_SukiSU_40900
          path: "*.zip"
