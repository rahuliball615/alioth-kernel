name: Build Alioth Stable MIUI SukiSU 40900

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Build Environment & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
            git gnupg gperf libncurses-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            binutils-aarch64-linux-gnu clang-14 lld-14 llvm-14

      - name: Clone Working Kernel Source (cbbad411 only)
        run: |
          git clone --depth=1 --branch v20260505-cbbad411 https://github.com/AstideLabs/android_kernel_xiaomi_sm8250.git .

      - name: Patch SukiSU Version to 40900
        run: |
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "Makefile" \) -exec sed -i 's/34891/40900/g' {} +
          echo "Driver code successfully updated to 40900"

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/device.name1=.*/device.name1=alioth/' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=aliothin/' AnyKernel3/anykernel.sh

      - name: Compile Stable Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out vendor/alioth_defconfig \
            CC=clang-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1

          make -j$(nproc --all) O=out \
            CC=clang-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Create Flashable Zip
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/vendor/qcom/*.dtb AnyKernel3/dtb 2>/dev/null || true

          cd AnyKernel3
          zip -r9 ../APTKernel_MIUI_alioth_ReSukiSU-SuSFS_40900.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APTKernel_MIUI_alioth_ReSukiSU-SuSFS_40900
          path: "*.zip"
